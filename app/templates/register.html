{% extends "base.html" %}
{% block title %}Create account · Brightloop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Create your account</h1><form method="post" novalidate><div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" autocomplete="name" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required><div class="form-text" id="password-help">More than 8 characters, with uppercase, lowercase, and a special character.</div></div><div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div><button class="btn btn-primary w-100" type="submit">Create account</button></form><p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div></div></div>
{% endblock %}
