{% extends "base.html" %}
{% block title %}Reset password · Brightloop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Choose a new password</h1><form method="post"><div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required><div class="form-text" id="password-help">More than 8 characters, with uppercase, lowercase, and a special character.</div></div><div class="mb-3"><label class="form-label" for="confirm_password">Confirm new password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div><button class="btn btn-primary w-100" type="submit">Reset password</button></form></div></div></div></div>
{% endblock %}
