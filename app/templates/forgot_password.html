{% extends "base.html" %}
{% block title %}Forgot password · Brightloop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-2">Forgot password?</h1><p class="text-secondary">Enter the email address associated with your account.</p><form method="post"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><button class="btn btn-primary w-100" type="submit">Send reset link</button></form><p class="mt-3 mb-0 text-center"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></div></div></div></div>
{% endblock %}
