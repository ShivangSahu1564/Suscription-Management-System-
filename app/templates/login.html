{% extends "base.html" %}
{% block title %}Sign in · Brightloop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Sign in</h1><form method="post" novalidate><input type="hidden" name="next" value="{{ next_url or '' }}"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Sign in</button></form><p class="mb-2 text-center"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p><p class="mt-3 mb-0 text-center">New to Brightloop? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div></div></div>
{% endblock %}
