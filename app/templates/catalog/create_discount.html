{% extends 'base.html' %}{% block content %}<h1 class="h2">{{ 'Edit discount' if discount else 'Create discount' }}</h1><form method="post" class="card card-body mt-3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required value="{{ discount.name if discount else '' }}"></div><div class="col-md-3"><label class="form-label">Type</label><select class="form-select" name="discount_type"><option value="fixed" {{ 'selected' if discount and discount.discount_type=='fixed' }}>Fixed amount</option><option value="percentage" {{ 'selected' if discount and discount.discount_type=='percentage' }}>Percentage</option></select></div><div class="col-md-3"><label class="form-label">Value</label><input class="form-control" name="value" type="number" min="0" step="0.01" required value="{{ discount.value if discount else '' }}"></div><div class="col-md-3"><label class="form-label">Minimum quantity</label><input class="form-control" name="minimum_quantity" type="number" min="1" value="{{ discount.minimum_quantity if discount else 1 }}"></div><div class="col-md-3"><label class="form-label">Minimum purchase</label><input class="form-control" name="minimum_purchase_amount" type="number" min="0" step="0.01" value="{{ discount.minimum_purchase_amount if discount else 0 }}"></div><div class="col-md-3"><label class="form-label">Start date</label><input class="form-control" name="start_date" type="date" value="{{ discount.start_date if discount and discount.start_date else '' }}"></div><div class="col-md-3"><label class="form-label">End date</label><input class="form-control" name="end_date" type="date" value="{{ discount.end_date if discount and discount.end_date else '' }}"></div><div class="col-md-4"><label class="form-label">Usage limit (blank = unlimited)</label><input class="form-control" name="usage_limit" type="number" min="0" value="{{ discount.usage_limit if discount and discount.usage_limit is not none else '' }}"></div><div class="col-md-4 form-check ms-2"><input class="form-check-input" type="checkbox" name="is_active" {{ 'checked' if not discount or discount.is_active }}><label class="form-check-label">Active</label></div><div class="col-12"><label class="form-label">Eligible products (none means all)</label><select class="form-select" name="product_ids" multiple size="5">{% for p in products %}<option value="{{ p.id }}" {{ 'selected' if discount and p.id in discount.products|map(attribute='product_id')|list }}>{{ p.name }}</option>{% endfor %}</select></div></div><button class="btn btn-primary mt-3">Save discount</button></form>{% endblock %}
