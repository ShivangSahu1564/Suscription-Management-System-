<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" maxlength="180" required value="{{ product.name if product else '' }}"></div><div class="col-md-6"><label class="form-label">Product type</label><input class="form-control" name="product_type" required value="{{ product.product_type if product else 'service' }}"></div><div class="col-md-6"><label class="form-label">Sales price</label><input class="form-control" name="sales_price" type="number" min="0" step="0.01" required value="{{ product.sales_price if product else '0.00' }}"></div><div class="col-md-6"><label class="form-label">Cost price</label><input class="form-control" name="cost_price" type="number" min="0" step="0.01" required value="{{ product.cost_price if product else '0.00' }}"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="3">{{ product.notes if product else '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save</button> <a class="btn btn-light" href="{{ url_for('catalog.products') }}">Cancel</a></div></div></form>
