{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-3">Tax rules</h1>{% if can_edit %}<form method="post" action="{{ url_for('catalog.save_tax') }}" class="row g-2 card card-body mb-3"><div class="col-md-5"><input class="form-control" name="name" placeholder="Tax name" required></div><div class="col-md-3"><input class="form-control" name="rate" type="number" min="0" max="100" step="0.0001" placeholder="Percentage" required></div><div class="col-auto"><button class="btn btn-primary">Add tax</button></div></form>{% endif %}<div class="table-responsive card"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Rate</th><th>Status</th>{% if can_edit %}<th>Actions</th>{% endif %}</tr></thead><tbody>{% for t in taxes %}<tr><form method="post" action="{{ url_for('catalog.save_tax') }}"><input type="hidden" name="tax_id" value="{{ t.id }}"><td><input class="form-control" name="name" value="{{ t.name }}" {{ 'readonly' if not can_edit }}></td><td><div class="input-group"><input class="form-control" name="rate" type="number" min="0" max="100" step="0.0001" value="{{ t.rate }}" {{ 'readonly' if not can_edit }}><span class="input-group-text">%</span></div></td><td>{{ 'Active' if t.is_active else 'Inactive' }}</td>{% if can_edit %}<td><button class="btn btn-sm btn-outline-primary">Save</button></form><form class="d-inline" method="post" action="{{ url_for('catalog.toggle_tax',tax_id=t.id) }}" onsubmit="return confirm('Change tax status?')"><button class="btn btn-sm btn-warning">{{ 'Deactivate' if t.is_active else 'Activate' }}</button></form></td>{% endif %}</tr>{% endfor %}</tbody></table></div>{% endblock %}
